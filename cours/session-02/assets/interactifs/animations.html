<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprendre en images — Session 2</title>
  <link rel="stylesheet" href="animations.css">
  <script defer src="animations.js"></script>
</head>
<body>
<main id="animation">
  <p class="eyebrow">COMPRENDRE EN IMAGES · DONNÉES FICTIVES</p>
  <h1 id="title">Animation pédagogique</h1>
  <p id="intro"></p>
  <div id="options" class="options"></div>
  <div id="visual"></div>
  <div class="controls" aria-label="Commandes de l’animation">
    <button id="play" type="button">▶ Lire</button>
    <button id="next" type="button">Avancer</button>
    <button id="reset" type="button">Recommencer</button>
    <label class="progress-label" for="progress"><span id="progress-label">Progression</span><input id="progress" type="range" min="0" max="100" value="0"></label>
  </div>
  <p id="message" class="message" aria-live="polite" aria-atomic="true"></p>
  <details><summary>Lire l’explication sans animation</summary><p id="alternative"></p></details>
  <noscript>Cette animation nécessite JavaScript. L’explication et les figures du cours restent disponibles autour de ce cadre.</noscript>
</main>
</body>
</html>

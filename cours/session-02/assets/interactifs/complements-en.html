<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive example</title><link rel="stylesheet" href="../../../session-02/assets/interactifs/complements.css"></head>
<body data-manual-animation="variance"><main><h1>Interactive example</h1>
<label for="state">State</label><input id="state" type="range" min="0" max="1" value="0" step="1" aria-describedby="value">
<output id="value" for="state"></output>
<div class="controls"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button><button id="play" type="button" aria-pressed="false">Play</button><button id="reset" type="button">Reset</button></div>
<figure><img alt="Loading the interactive example." width="784" height="672"><figcaption id="explanation"></figcaption></figure>

</main><script src="../../../session-02/assets/interactifs/complements.js"></script></body></html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complément interactif</title><link rel="stylesheet" href="../../../session-02/assets/interactifs/complements.css"></head>
<body data-manual-animation="variance"><main><h1>Complément interactif</h1>
<label for="state">État</label><input id="state" type="range" min="0" max="1" value="0" step="1" aria-describedby="value">
<output id="value" for="state"></output>
<div class="controls"><button id="previous" type="button">Précédent</button><button id="next" type="button">Suivant</button><button id="play" type="button" aria-pressed="false">Lire</button><button id="reset" type="button">Réinitialiser</button></div>
<figure><img alt="Le complément se charge." width="784" height="672"><figcaption id="explanation"></figcaption></figure>
<noscript>JavaScript est nécessaire pour changer d’état. La version PDF contient une comparaison statique.</noscript>
</main><script src="../../../session-02/assets/interactifs/complements.js"></script></body></html>

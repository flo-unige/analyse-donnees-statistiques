project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - cours/session-01/index.qmd
    - cours/session-02/index.qmd
    - cours/session-03/index.qmd
    - cours/session-04/index.qmd
    - cours/session-05/index.qmd
    - cours/session-06/index.qmd
  resources:
    - cours/session-02/assets/interactifs/**
    - cours/session-02/assets/video/**
    - cours/session-02/data/**

quarto-required: "1.10.18"

website:
  title: "Analyse de données statistiques"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#8b1e5a"
    foreground: light
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Cours"
        href: cours/session-02/index.qmd
  sidebar:
    - title: "Cours"
      style: docked
      contents:
        - cours/session-01/index.qmd
        - cours/session-02/index.qmd
        - cours/session-03/index.qmd
        - cours/session-04/index.qmd
        - cours/session-05/index.qmd
        - cours/session-06/index.qmd
  page-footer:
    background: "#2c3e50"
    foreground: light
    left: "Analyse de données statistiques — Université de Genève"
    right:
      - text: "Site créé avec Quarto"
        href: https://quarto.org/

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    smooth-scroll: true
    code-fold: true
    code-summary: "Afficher le code Python"
    code-tools: true
    fig-responsive: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  error: false

lang: fr

    - tp/index-en.qmd
    - tp/session-01/index.qmd
    - tp/session-01/index-en.qmd
    - tp/session-02/index.qmd
    - tp/session-02/index-en.qmd
    - tp/session-03/index.qmd
    - tp/session-03/index-en.qmd
    - tp/session-04/index.qmd
    - tp/session-04/index-en.qmd
    - tp/session-05/index.qmd
    - tp/session-05/index-en.qmd
    - tp/session-06/index.qmd
    - tp/session-06/index-en.qmd
    - tp/session-07/index.qmd
    - tp/session-07/index-en.qmd
    - ressources/index.qmd
    - ressources/index-en.qmd
    - cours/session-01/index.qmd
    - cours/session-02/index.qmd
    - cours/session-02/index-en.qmd
    - cours/session-02/index-r.qmd
    - cours/session-02/index-en-r.qmd
    - cours/session-03/index.qmd
    - cours/session-04/index.qmd
    - cours/session-05/index.qmd

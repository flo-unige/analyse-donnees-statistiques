    - cours/session-07/index.qmd
    - cours/session-01/index-en.qmd
    - cours/session-03/index-en.qmd
    - cours/session-04/index-en.qmd
    - cours/session-05/index-en.qmd
    - cours/session-06/index-en.qmd
    - cours/session-07/index-en.qmd
  resources:
    - cours/session-01/fichiers/**
    - tp/session-01/fichiers/**
    - assets/**
    - cours/session-02/assets/language.css
    - cours/session-02/assets/language.js
    - cours/session-02/assets/interactifs/**
    - cours/session-02/assets/video/**
    - cours/session-02/data/**

quarto-required: "1.10.18"

website:
  title: "Analyse de données statistiques"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#8b1e5a"
    foreground: light
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Cours"
        href: cours/session-01/index.qmd
      - text: "Travaux pratiques"
        href: tp/index.qmd
      - text: "Ressources"
        href: ressources/index.qmd
  sidebar:
    - id: cours
      title: "Cours"
      style: docked
      contents:
        - cours/session-01/index.qmd
        - cours/session-02/index.qmd
        - cours/session-03/index.qmd
        - cours/session-04/index.qmd
        - cours/session-05/index.qmd
        - cours/session-06/index.qmd
        - cours/session-07/index.qmd
    - id: tp
      title: "Travaux pratiques"
      style: docked
      contents:
        - tp/index.qmd
        - tp/session-01/index.qmd
        - tp/session-02/index.qmd
        - tp/session-03/index.qmd
        - tp/session-04/index.qmd
        - tp/session-05/index.qmd
        - tp/session-06/index.qmd
        - tp/session-07/index.qmd
  page-footer:
    background: "#2c3e50"
    foreground: light
    left: "Analyse de données statistiques - Université de Genève"
    right:
      - text: "Site créé avec Quarto"
        href: https://quarto.org/

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "Sur cette page"
    smooth-scroll: true
    code-fold: true
    code-summary: "Afficher le code Python"
    code-tools: true
    fig-responsive: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  error: false

lang: fr

<script>
// Use the explicit course page instead of the former placeholder's directory URL.
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('a[href]').forEach(link => {
    const url = new URL(link.href, document.baseURI);
    if (url.origin === location.origin && /\/cours\/session-03\/$/.test(url.pathname)) {
      url.pathname += 'index.html';
      link.href = url.href;
    }
  });
});
</script>
